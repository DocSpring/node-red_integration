# Publishes @docspring/node-red-docspring to npm when a v*.*.* tag is pushed, with an npm provenance
# attestation, so a release never depends on anyone's machine or npm login.
#
# Auth: npm trusted publishing (OIDC, no stored secret). The package's npm settings list this repository and
# workflow (publish.yml) as a trusted publisher.
name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish to npm (with provenance)
    runs-on: ubuntu-latest
    permissions:
      id-token: write # the OIDC token for trusted publishing and the provenance attestation
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted publishing needs npm 11.5.1 or later. Pinned: a version at least 7 days old, never "latest".
      - name: Install npm 11.21.1
        run: npm install -g npm@11.21.1

      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match package.json version ${version}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Publish with provenance
        run: npm publish --provenance --access public
